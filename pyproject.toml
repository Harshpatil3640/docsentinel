[project]
name = "docsentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harsh", email = "harshpatil3640@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.54.0",
    "fpdf2>=2.9.0",
    "langchain-groq>=1.2.1",
    "langchain-ollama>=1.1.0",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.4",
]

[project.scripts]
docsentinel = "docsentinel:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
